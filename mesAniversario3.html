<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Março - O Mês da Sua Vida</title>
    <link rel="stylesheet" href="styleCartas.css">
    <link rel="icon" type="image/png" href="img/fundo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="cabecalho">
        <div class="titulo-box">
            <h1>Março: O Mês Literalmente da Sua Vida!</h1>
            <p><b>Data: 13/03/2026</b></p>

            <div class="contador-box">
                <p class="contador-titulo">Contagem para o seu dia especial 🎂</p>
                <div id="contador"></div>
            </div>

            <a href="index.html" class="btn-voltar">
                ⬅ Voltar para o início
            </a>
        </div>
    </header>
    <main>

        <section id="intro">

            <button onclick="iniciarExperiencia()" class="btn-musica">
                ❤️ Toque aqui antes de continuar
            </button>

        </section>

        <audio id="musica" loop>
            <source src="music/Edd_Sheeran_-_Perfect_(mp3.pm).mp3" type="audio/mp3">
        </audio>

        <section class="cartas-container">

            <div class="envelope">

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="Hoje o presente é um pouco diferente. Cartas escritas fisicamente são boas, mas nada como deixar cartas guardadas no lugar que fiz pra você sempre se sentir especial, amada e diferente de qualquer outra pessoa.">
                    </p>
                </div>

            </div>

            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="Hoje o presente não é físico mas sim algo pensado com muito carinho na pessoa que você é pra mim. Na minha concepção isso vale mais do que qualquer coisa.">
                    </p>
                </div>

            </div>

            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="Existem pessoas que passam pela nossa vida… e existem pessoas que mudam completamente a forma como a gente vê o mundo.">
                    </p>
                </div>

            </div>


            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="Desde que você entrou na minha vida, os dias ficaram mais leves, os planos ficaram maiores e o futuro começou a parecer mais bonito.">
                    </p>
                </div>

            </div>


            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p data-text="Você não é só alguém especial para mim. Você é alguém que eu admiro profundamente.">
                    </p>
                </div>

            </div>


            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="E hoje eu só queria registrar isso aqui: você é uma das melhores coisas que já aconteceram na minha vida.">
                    </p>
                </div>

            </div>

            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="E como você me faz tão bem não tem porque de eu não te fazer se sentir especial sempre que eu puder.">
                    </p>
                </div>

            </div>

            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="Seu dia está perto de chegar, o dia em que você celebra mais um ano de vida e mais um ano de conquista. Você cresceu e tem crescido muito nesses últimos meses. Você é incrível, você é invencível!">
                    </p>
                </div>

            </div>


            <div class="envelope">

                <button class="btn-abrir" onclick="abrirEsteEnvelope(this)">💌 Abrir carta</button>

                <div class="tampa"></div>

                <div class="carta">
                    <p
                        data-text="Se algum dia você duvidar do quanto é importante para mim… volte nesta página e leia essas cartas novamente.">
                    </p>
                </div>

            </div>

        </section>

    </main>

    <div id="fraseFinal" class="frase-final">
        ❤️ Eu te amo muito ❤️
    </div>

    <div id="fotoFinal" class="foto-final">
        <img src="img/thiagoBruna.jpg" alt="Nós dois">
    </div>

    <script src="script/cartas.js"></script>
</body>

</html>
