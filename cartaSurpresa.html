<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Carta Pra Você ❤️</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffe6ee, #ffd6e7);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* 🔥 HEADER PADRÃO NOVO */
        .header {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #333;
        }

        .sub {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }

        .btn-voltar {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff4d88;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
        }

        .btn-voltar:hover {
            background: #ff2f74;
        }

        /* 💌 CARD */
        .card {
            background: white;
            margin-top: 30px;
            padding: 30px 20px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            text-align: center;
        }

        /* 📩 ENVELOPE */
        .envelope {
            width: 100%;
            max-width: 320px;
            height: 200px;
            background: #ff8fab;
            margin: 0 auto;
            position: relative;
            border-radius: 10px;
        }

        .tampa {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 100px solid #ff4d88;
            top: 0;
            left: 0;
            transform-origin: top;
            transition: 1s;
        }

        .carta {
            position: absolute;
            background: white;
            width: 85%;
            left: 7.5%;
            top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            transform: translateY(40px);
            opacity: 0;
            transition: 1s ease;
        }

        #texto {
            font-size: 15px;
            line-height: 1.7;
            text-align: left;
            white-space: pre-line;
            color: #333;
        }

        .assinatura {
            margin-top: 15px;
            font-weight: bold;
            color: #ff2f74;
        }

        .envelope.aberto .tampa {
            transform: rotateX(180deg);
        }

        .envelope.aberto .carta {
            transform: translateY(-20px);
            opacity: 1;
        }

        /* 🔥 BOTÃO BONITO */
        .btn-abrir {
            margin-top: 20px;
            background: #ff4d88;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-abrir:hover {
            background: #ff2f74;
        }

        @media (max-width: 480px) {
            .tampa {
                border-left: 45vw solid transparent;
                border-right: 45vw solid transparent;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ❤️ HEADER NOVO -->
        <div class="header">
            <h1>Leia com calma, foi feito com o coração 💖</h1>
            <div class="sub">Cada palavra aqui tem um pedacinho de você</div>
            <a href="index.html" class="btn-voltar">⬅ Voltar</a>
        </div>

        <!-- 💌 CARD -->
        <div class="card">

            <div class="envelope">

                <div class="tampa"></div>

                <div class="carta">
                    <p id="texto"></p>
                    <div class="assinatura">— Com amor, Thiago Lemos ❤️</div>
                </div>

            </div>

            <button class="btn-abrir" onclick="abrirCarta()">💌 Abrir carta</button>

        </div>

    </div>

    <script>

        const mensagem = `Amor, essa semana que passou eu fiquei bem pensativo…
Talvez eu tenha parecido um pouco mais quieto ou distante em alguns momentos, mas foi só coisa da minha cabeça mesmo refletindo sobre a vida...

Eu gosto muito da nossa conexão, de estar com você e perceber o quanto você é incrível em tudo: no jeito que fala, no jeito que vive, no jeito que é.

Eu tô numa correria grande com trabalho, futuro e tudo que eu quero construir. Mas no meio disso tudo eu percebi algo muito forte: antes era só eu por mim, e hoje não é mais assim.

Você entrou na minha vida com esse seu jeito todo seu, e você não tem noção do impacto que causou em mim, de uma forma muito boa.

Hoje eu penso em ser melhor por mim, sim! Mas também com você do meu lado. Você faz parte da força que eu tenho pra buscar tudo que eu quero.

Eu sei que ainda não tô onde eu quero chegar, e às vezes isso mexe comigo. Mas eu não posso parar. E ter você comigo faz tudo ter mais sentido.

E quando você fala sobre Deus, sobre propósito, sobre caminhar junto, isso toca muito em mim. Eu também acredito que não é por acaso tudo isso que estamos vivendo.

Hoje eu parei pra pensar no quanto eu amo coisas simples com você...

Você é muito importante pra mim, Bruna.

Eu amo você ❤️`;

        function abrirCarta() {
            const envelope = document.querySelector(".envelope");
            envelope.classList.add("aberto");

            const texto = document.getElementById("texto");

            setTimeout(() => {
                texto.textContent = mensagem;
            }, 400);
        }

    </script>

</body>

</html>
